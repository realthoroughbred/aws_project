<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 찾는 나의 운명 같은 유기동물 🐾</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Malgun Gothic', sans-serif; background: #1E1B4B; color: white; min-height: 100vh; }

    /* 헤더 */
    .header { text-align: center; padding: 40px 20px 20px; }
    .header h1 { font-size: 42px; color: #1D9E75; }
    .header p { font-size: 16px; color: #aaa; margin-top: 8px; }

    /* 진행바 */
    .progress-bar { width: 80%; max-width: 600px; height: 8px; background: #333; border-radius: 4px; margin: 20px auto; }
    .progress-fill { height: 100%; background: #1D9E75; border-radius: 4px; transition: width 0.3s; }

    /* 테스트 화면 */
    .test-container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .question-box { background: #2D2A6E; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
    .question-num { font-size: 13px; color: #1D9E75; margin-bottom: 10px; }
    .question-text { font-size: 20px; font-weight: bold; margin-bottom: 24px; line-height: 1.5; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { background: #1E1B4B; border: 2px solid #534AB7; color: white; padding: 14px 20px; border-radius: 10px; font-size: 15px; cursor: pointer; text-align: left; transition: all 0.2s; }
    .option-btn:hover { background: #534AB7; }
    .option-btn.selected { background: #534AB7; border-color: #1D9E75; }

    /* 결과 화면 */
    .result-container { max-width: 700px; margin: 0 auto; padding: 20px; display: none; }
    .my-mbti { text-align: center; background: #2D2A6E; border-radius: 16px; padding: 30px; margin-bottom: 24px; }
    .my-mbti h2 { font-size: 18px; color: #aaa; margin-bottom: 8px; }
    .my-mbti .mbti-type { font-size: 52px; font-weight: bold; color: #1D9E75; }
    .my-mbti p { color: #aaa; margin-top: 8px; }

    /* 모드 선택 */
    .mode-select { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    .mode-btn { background: #2D2A6E; border: 2px solid #534AB7; color: white; padding: 20px; border-radius: 12px; font-size: 15px; cursor: pointer; text-align: center; transition: all 0.2s; }
    .mode-btn:hover { border-color: #1D9E75; background: #1a1840; }
    .mode-btn.active { border-color: #1D9E75; background: #1a3a30; }
    .mode-btn .icon { font-size: 28px; margin-bottom: 8px; }
    .mode-btn .title { font-weight: bold; margin-bottom: 4px; }
    .mode-btn .desc { font-size: 12px; color: #aaa; }

    /* 동물 카드 */
    .cards-container { display: flex; flex-direction: column; gap: 16px; }
    .animal-card { background: #2D2A6E; border-radius: 16px; padding: 20px; border: 2px solid #534AB7; }
    .animal-card.rank1 { border-color: #1D9E75; }
    .card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .rank-badge { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; }
    .rank1 .rank-badge { background: #1D9E75; }
    .rank2 .rank-badge { background: #534AB7; }
    .rank3 .rank-badge { background: #BA7517; }
    .animal-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background: #1E1B4B; flex-shrink: 0; }
    .animal-info { flex: 1; }
    .animal-name { font-size: 17px; font-weight: bold; }
    .animal-mbti { font-size: 13px; color: #1D9E75; font-weight: bold; margin-top: 3px; }
    .compat-score { font-size: 28px; font-weight: bold; color: #1D9E75; text-align: right; }
    .compat-label { font-size: 12px; color: #aaa; text-align: right; }
    .compat-bar { height: 8px; background: #1E1B4B; border-radius: 4px; overflow: hidden; margin: 10px 0; }
    .compat-fill { height: 100%; background: #1D9E75; border-radius: 4px; }
    .compat-msg { font-size: 13px; color: #9FE1CB; background: #1a3a30; padding: 8px 12px; border-radius: 8px; margin-top: 8px; }
    .shelter-info { font-size: 12px; color: #aaa; margin-top: 8px; }

    /* 검색창 (모드B) */
    .search-box { display: none; background: #2D2A6E; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .search-box input { width: 100%; background: #1E1B4B; border: 1px solid #534AB7; color: white; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
    .search-btn { background: #534AB7; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; }

    /* 버튼 */
    .match-btn { width: 100%; background: #1D9E75; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .match-btn:hover { background: #0F6E56; }
    .retry-btn { width: 100%; background: #534AB7; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; cursor: pointer; margin-top: 12px; }

    /* 로딩 */
    .loading { text-align: center; padding: 40px; display: none; }
    .loading p { color: #aaa; margin-top: 12px; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="header">
  <h1>🐾 PawType</h1>
  <p>나의 MBTI로 찾는 나만의 유기동물</p>
</div>

<!-- 진행바 -->
<div class="progress-bar">
  <div class="progress-fill" id="progressFill" style="width: 0%"></div>
</div>

<!-- MBTI 테스트 화면 -->
<div class="test-container" id="testSection">
  <div class="question-box">
    <div class="question-num" id="questionNum">질문 1 / 12</div>
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionButtons"></div>
  </div>
</div>

<!-- 결과 화면 -->
<div class="result-container" id="resultSection">

  <!-- 나의 MBTI -->
  <div class="my-mbti">
    <h2>나의 MBTI</h2>
    <div class="mbti-type" id="myMbtiType"></div>
    <p id="myMbtiDesc"></p>
  </div>

  <!-- 모드 선택 -->
  <div class="mode-select">
    <div class="mode-btn active" id="modeA" onclick="selectMode('A')">
      <div class="icon">🏆</div>
      <div class="title">추천받기</div>
      <div class="desc">궁합 TOP 3 자동 추천</div>
    </div>
    <div class="mode-btn" id="modeB" onclick="selectMode('B')">
      <div class="icon">🔍</div>
      <div class="title">직접 선택</div>
      <div class="desc">동물 ID로 궁합 확인</div>
    </div>
  </div>

  <!-- 모드 B 검색 -->
  <div class="search-box" id="searchBox">
    <input type="text" id="animalIdInput" placeholder="동물 ID 입력 (예: 441393202600169)">
    <button class="search-btn" onclick="getOneCompat()">궁합 확인</button>
  </div>

  <!-- 매칭 버튼 -->
  <button class="match-btn" id="matchBtn" onclick="getTop3()">🐾 나에게 맞는 동물 찾기</button>

  <!-- 로딩 -->
  <div class="loading" id="loading">
    <div style="font-size: 40px;">🐾</div>
    <p>AI가 나와 맞는 동물을 찾는 중...</p>
  </div>

  <!-- 동물 카드 -->
  <div class="cards-container" id="cardsContainer"></div>

  <!-- 다시하기 -->
  <button class="retry-btn hidden" id="retryBtn" onclick="retry()">🔄 다시 테스트하기</button>

</div>

<script>
const API_URL = "http://127.0.0.1:5000";

// MBTI 테스트 문항
const questions = [
  { q: "처음 보는 사람에게 먼저 말을 건다", a: ["매우 그렇다", "그렇다", "아니다", "매우 아니다"], axis: "EI", scores: [2,1,-1,-2] },
  { q: "여러 사람과 어울리는 것이 즐겁다", a: ["매우 그렇다", "그렇다", "아니다", "매우 아니다"], axis: "EI", scores: [2,1,-1,-2] },
  { q: "혼자 있는 시간보다 사람들과 있는 게 좋다", a: ["매우 그렇다", "그렇다", "아니다", "매우 아니다"], axis: "EI", scores: [2,1,-1,-2] },
  { q: "매일 활발하게 운동이나 산책을 즐긴다", a: ["매우 그렇다", "그렇다", "아니다", "매우 아니다"], axis: "SN", scores: [2,1,-1,-2] },
  { q: "에너지가 넘치고 활동적인 편이다", a: ["매우 그렇다", "그렇다", "아니다", "매우 아니다"], axis: "SN", scores: [2,1,-1,-2] },
  { q: "조용히 쉬는 것보다 뭔가 하는 게 좋다", a: ["매우 그렇다", "그렇다", "아니다", "매우 아니다"], axis: "SN", scores: [2,1,-1,-2] },
  { q: "항상 곁에 붙어있고 애교 많은 걸 좋아한다", a: ["매우 그렇다", "그렇다", "아니다", "매우 아니다"], axis: "TF", scores: [2,1,-1,-2] },
  { q: "스킨십을 자주 하는 편이다", a: ["매우 그렇다", "그렇다", "아니다", "매우 아니다"], axis: "TF", scores: [2,1,-1,-2] },
  { q: "독립적인 것보다 함께하는 게 좋다", a: ["매우 그렇다", "그렇다", "아니다", "매우 아니다"], axis: "TF", scores: [2,1,-1,-2] },
  { q: "새로운 환경에도 빠르게 적응하는 편이다", a: ["매우 그렇다", "그렇다", "아니다", "매우 아니다"], axis: "JP", scores: [2,1,-1,-2] },
  { q: "변화를 즐기고 유연하게 대처한다", a: ["매우 그렇다", "그렇다", "아니다", "매우 아니다"], axis: "JP", scores: [2,1,-1,-2] },
  { q: "규칙적인 생활보다 자유로운 게 좋다", a: ["매우 그렇다", "그렇다", "아니다", "매우 아니다"], axis: "JP", scores: [2,1,-1,-2] },
];

let currentQ = 0;
let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
let myMbti = "";
let currentMode = "A";

// 문항 표시
function showQuestion() {
  const q = questions[currentQ];
  document.getElementById("questionNum").textContent = `질문 ${currentQ + 1} / ${questions.length}`;
  document.getElementById("questionText").textContent = q.q;
  document.getElementById("progressFill").style.width = `${(currentQ / questions.length) * 100}%`;

  const optDiv = document.getElementById("optionButtons");
  optDiv.innerHTML = "";
  q.a.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = text;
    btn.onclick = () => selectAnswer(i);
    optDiv.appendChild(btn);
  });
}

// 답변 선택
function selectAnswer(idx) {
  const q = questions[currentQ];
  const score = q.scores[idx];
  if (q.axis === "EI") score > 0 ? scores.E += score : scores.I += Math.abs(score);
  if (q.axis === "SN") score > 0 ? scores.S += score : scores.N += Math.abs(score);
  if (q.axis === "TF") score > 0 ? scores.F += score : scores.T += Math.abs(score);
  if (q.axis === "JP") score > 0 ? scores.P += score : scores.J += Math.abs(score);

  currentQ++;
  if (currentQ < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

// MBTI 계산
function calcMbti() {
  return (scores.E >= scores.I ? "E" : "I") +
         (scores.S >= scores.N ? "S" : "N") +
         (scores.F >= scores.T ? "F" : "T") +
         (scores.P >= scores.J ? "P" : "J");
}

const mbtiDesc = {
  "ENFP": "열정적인 활동가", "INFP": "조용한 감성파",
  "ENFJ": "따뜻한 리더", "INFJ": "통찰력 있는 조언자",
  "ENTP": "논쟁을 즐기는 토론가", "INTP": "분석적인 사색가",
  "ENTJ": "대담한 지휘관", "INTJ": "전략적인 계획가",
  "ESFP": "자유로운 연예인", "ISFP": "호기심 많은 예술가",
  "ESFJ": "배려하는 외교관", "ISFJ": "따뜻한 수호자",
  "ESTP": "모험을 즐기는 사업가", "ISTP": "만능 재주꾼",
  "ESTJ": "엄격한 관리자", "ISTJ": "청렴한 관리자",
};

// 결과 화면 표시
function showResult() {
  myMbti = calcMbti();
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("testSection").style.display = "none";
  document.getElementById("resultSection").style.display = "block";
  document.getElementById("myMbtiType").textContent = myMbti;
  document.getElementById("myMbtiDesc").textContent = mbtiDesc[myMbti] || "";
}

// 모드 선택
function selectMode(mode) {
  currentMode = mode;
  document.getElementById("modeA").classList.toggle("active", mode === "A");
  document.getElementById("modeB").classList.toggle("active", mode === "B");
  document.getElementById("searchBox").style.display = mode === "B" ? "block" : "none";
  document.getElementById("matchBtn").style.display = mode === "A" ? "block" : "none";
  document.getElementById("cardsContainer").innerHTML = "";
  document.getElementById("retryBtn").classList.add("hidden");
}

// TOP 3 추천
async function getTop3() {
  document.getElementById("loading").style.display = "block";
  document.getElementById("cardsContainer").innerHTML = "";
  document.getElementById("retryBtn").classList.add("hidden");

  try {
    const res = await fetch(`${API_URL}/match/top3`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_mbti: myMbti })
    });
    const data = await res.json();
    showCards(data.results);
  } catch (e) {
    alert("서버 연결 실패! app.py 켜져 있는지 확인하세요.");
  } finally {
    document.getElementById("loading").style.display = "none";
  }
}

// 1:1 궁합
async function getOneCompat() {
  const animalId = document.getElementById("animalIdInput").value.trim();
  if (!animalId) { alert("동물 ID를 입력하세요!"); return; }

  document.getElementById("loading").style.display = "block";
  document.getElementById("cardsContainer").innerHTML = "";

  try {
    const res = await fetch(`${API_URL}/match/one`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_mbti: myMbti, animal_id: animalId })
    });
    const data = await res.json();
    showCards([data]);
  } catch (e) {
    alert("서버 연결 실패!");
  } finally {
    document.getElementById("loading").style.display = "none";
  }
}

// 카드 표시
function showCards(results) {
  const container = document.getElementById("cardsContainer");
  container.innerHTML = "";

  results.forEach((r, i) => {
    const rankClass = i === 0 ? "rank1" : i === 1 ? "rank2" : "rank3";
    const card = document.createElement("div");
    card.className = `animal-card ${rankClass}`;
    card.innerHTML = `
      <div class="card-header">
        <div class="rank-badge">${i + 1}위</div>
        <img class="animal-img" src="${r.image_url}" onerror="this.src=''" alt="동물사진">
        <div class="animal-info">
          <div class="animal-name">${r.name} · ${r.sex === 'M' ? '수컷' : r.sex === 'F' ? '암컷' : '미상'} · ${r.age}</div>
          <div class="animal-mbti">${r.animal_mbti} — ${mbtiDesc[r.animal_mbti] || ""}</div>
        </div>
        <div>
          <div class="compat-score">${r.compat_score}점</div>
          <div class="compat-label">${r.compat_label}</div>
        </div>
      </div>
      <div class="compat-bar">
        <div class="compat-fill" style="width: ${r.compat_score}%"></div>
      </div>
      <div class="compat-msg">${r.compat_msg}</div>
      <div class="shelter-info">📍 ${r.shelter} · ${r.shelter_addr}</div>
    `;
    container.appendChild(card);
  });

  document.getElementById("retryBtn").classList.remove("hidden");
}

// 다시하기
function retry() {
  currentQ = 0;
  scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  myMbti = "";
  document.getElementById("resultSection").style.display = "none";
  document.getElementById("testSection").style.display = "block";
  document.getElementById("cardsContainer").innerHTML = "";
  document.getElementById("progressFill").style.width = "0%";
  showQuestion();
}

// 시작
showQuestion();
</script>
</body>
</html>
